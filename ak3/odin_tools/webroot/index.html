<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>MIX4 刷新率</title>
<style>
:root{
  --bg:#0b0e14; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.03);
  --line:rgba(255,255,255,.09); --txt:#e8ecf4; --sub:#8b93a7;
  --v:39,111,255; --c:14,165,233; --g:34,197,94; --w:#64748b; --r:239,68,68;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;min-height:100%}
body{background:radial-gradient(1200px 500px at 80% -10%,rgba(79,70,229,.16),transparent 60%),radial-gradient(900px 400px at -10% 20%,rgba(6,182,212,.10),transparent 55%),var(--bg);padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:430px;margin:0 auto}
header{text-align:center;padding:8px 0 18px}
h1{font-size:22px;font-weight:700;letter-spacing:.5px;background:linear-gradient(120deg,#a5b4fc,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--sub);font-size:12px;margin-top:5px}
.badge{display:inline-block;margin-top:10px;font-size:10px;color:#c4b5fd;border:1px solid rgba(167,139,250,.35);background:rgba(167,139,250,.1);padding:3px 10px;border-radius:99px;letter-spacing:.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(8px);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .k{font-size:11px;color:var(--sub);margin-bottom:6px}
.stat .v{font-size:20px;font-weight:700;line-height:1}
.stat .v small{font-size:11px;color:var(--sub);font-weight:400;margin-left:2px}
.stat.hz .v{color:#22d3ee}.stat.mode .v{color:#a5b4fc}
.stat.dfps .v{color:#fbbf24}.stat.power .v{color:#34d399}
h2{font-size:13px;color:var(--sub);margin:4px 2px 12px;font-weight:500;letter-spacing:.3px}
.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.btn{position:relative;border:none;border-radius:14px;padding:16px 10px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;transition:transform .12s,filter .12s;box-shadow:0 6px 18px rgba(0,0,0,.35);overflow:hidden}
.btn:active{transform:scale(.96)}
.btn .hz{font-size:20px}
.btn .t{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:3px}
.btn144{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.btn120{background:linear-gradient(135deg,#0e7490,#06b6d4)}
.btn60{background:linear-gradient(135deg,#475569,#64748b)}
.btnauto{background:linear-gradient(135deg,#15803d,#22c55e)}
.btn.active::after{content:"✓";position:absolute;top:8px;right:12px;font-size:14px;font-weight:800;background:rgba(0,0,0,.25);border-radius:99px;padding:1px 7px}
.btn:disabled{opacity:.55;pointer-events:none}
.logbox{max-height:150px;overflow-y:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:#94a3b8;line-height:1.7;white-space:pre-wrap;word-break:break-all;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.logbox:empty::before{content:"暂无日志";color:#475569}
.hint{text-align:center;color:#475569;font-size:11px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(20,24,32,.95);color:#e2e8f0;padding:10px 18px;border-radius:99px;font-size:13px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MIX4 屏幕刷新率</h1>
    <div class="sub">odin_tools · ReSukiSU 模块</div>
    <span class="badge">144Hz DTBO 已启用</span>
  </header>

  <div class="card">
    <div class="grid">
      <div class="stat hz"><div class="k">当前峰值</div><div class="v" id="sPeak">--</div></div>
      <div class="stat dfps"><div class="k">DFPS 属性</div><div class="v" id="sDfps">--</div></div>
      <div class="stat mode"><div class="k">运行模式</div><div class="v" id="sMode">--</div></div>
      <div class="stat power"><div class="k">省电模式</div><div class="v" id="sPower">--</div></div>
    </div>
  </div>

  <h2>一键切换帧率</h2>
  <div class="btns">
    <button class="btn btn144" data-hz="144"><span class="hz">144Hz</span><span class="t">极速 · 硬件支持</span></button>
    <button class="btn btn120" data-hz="120"><span class="hz">120Hz</span><span class="t">流畅 · 省电均衡</span></button>
    <button class="btn btn60" data-hz="60"><span class="hz">60Hz</span><span class="t">省电 · 长续航</span></button>
    <button class="btn btnauto" data-hz="auto"><span class="hz">守护模式</span><span class="t">默认120 · 防回落</span></button>
  </div>

  <div class="card" style="margin-top:14px">
    <h2 style="margin:0">守护日志</h2>
    <div class="logbox" id="log"></div>
  </div>

  <a href="modes.html" style="display:block;text-align:center;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;color:#34d399;text-decoration:none;font-size:14px;font-weight:600;background:rgba(52,211,153,.08)">电源档位 · 均衡/省电切换 →</a>

  <a href="ts.html" style="display:block;text-align:center;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;color:#a5b4fc;text-decoration:none;font-size:14px;font-weight:600;background:rgba(79,70,229,.08)">触控采样率 · 480/240Hz 切换 →</a>

  <div class="hint">点击按钮后立即生效 · 状态每 5 秒自动刷新</div>
</div>

<div id="toast"></div>

<script>
let _cc = 0;
function ksuExec(cmd) {
  return new Promise((resolve, reject) => {
    if (typeof ksu === 'undefined' || !ksu || !ksu.exec) {
      reject(new Error('KSU bridge not available'));
      return;
    }
    const name = 'cb_' + Date.now() + '_' + (_cc++);
    window[name] = function (errno, stdout, stderr) {
      delete window[name];
      resolve({ errno: errno | 0, stdout: stdout || '', stderr: stderr || '' });
    };
    try {
      ksu.exec(cmd, '{}', name);
    } catch (e) {
      delete window[name];
      reject(e);
    }
  });
}

const $ = id => document.getElementById(id);
let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

const MOD = '/data/adb/modules/odin_tools';

async function readState() {
  try {
    const [peak, dfps, power, mode] = await Promise.all([
      ksuExec('settings get system peak_refresh_rate'),
      ksuExec('getprop persist.vendor.dfps.level'),
      ksuExec('settings get global low_power'),
      ksuExec('test -f ' + MOD + '/.user_set && echo manual || echo auto'),
    ]);
    $('sPeak').textContent = (peak.stdout || '').trim() || '--';
    $('sDfps').textContent = (dfps.stdout || '').trim() || '--';
    $('sPower').textContent = ((power.stdout || '').trim() === '1') ? '开' : '关';
    const m = (mode.stdout || '').trim();
    $('sMode').textContent = (m === 'manual') ? '手动' : '守护';
    highlight(m, (peak.stdout || '').trim());
  } catch (e) {
    $('sPeak').textContent = 'N/A';
  }
  try {
    const log = await ksuExec('tail -n 12 ' + MOD + '/.fps144.log 2>/dev/null');
    $('log').textContent = (log.stdout || '').trim();
  } catch (e) {}
}

function highlight(mode, peak) {
  document.querySelectorAll('.btn[data-hz]').forEach(b => b.classList.remove('active'));
  let target = null;
  if (mode === 'manual') {
    target = peak === '144' ? '144' : (peak === '120' ? '120' : (peak === '60' ? '60' : null));
  } else {
    target = 'auto';
  }
  if (target) {
    const btn = document.querySelector('.btn[data-hz="' + target + '"]');
    if (btn) btn.classList.add('active');
  }
}

async function setMode(hz) {
  const btn = document.querySelector('.btn[data-hz="' + hz + '"]');
  if (!btn) return;
  const map = { 144: '/data/adb/modules/odin_tools/bin/fps144', 120: '/data/adb/modules/odin_tools/bin/fps120', 60: '/data/adb/modules/odin_tools/bin/fps60', auto: '/data/adb/modules/odin_tools/bin/fps_auto' };
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span><span class="hz">应用中</span>';
  try {
    const r = await ksuExec(map[hz]);
    if (r.errno === 0) {
      toast(hz === 'auto' ? '已开启守护模式（默认 120Hz）' : '已切换到 ' + hz + 'Hz');
    } else {
      toast('执行失败 (' + (r.stderr || r.errno) + ')');
    }
  } catch (e) {
    toast('KSU 桥不可用，请用 KernelSU 管理器打开');
  }
  btn.disabled = false;
  const label = { 144: ['144Hz', '极速 · 硬件支持'], 120: ['120Hz', '流畅 · 省电均衡'], 60: ['60Hz', '省电 · 长续航'], auto: ['守护模式', '默认120 · 防回落'] }[hz];
  btn.innerHTML = '<span class="hz">' + label[0] + '</span><span class="t">' + label[1] + '</span>';
  setTimeout(readState, 800);
}

document.querySelectorAll('.btn[data-hz]').forEach(b => {
  b.addEventListener('click', () => setMode(b.dataset.hz));
});

readState();
setInterval(readState, 5000);
</script>
</body>
</html>
