name: MIX4 odin kernel build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'odin_patch/**', 'config/**', '.github/workflows/**' ]

env:
  TZ: Asia/Shanghai
  REPO: ATK12/mix4-odin-kernel
  BASE_TAG: v50-full-ATK12

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd pahole bc bison flex cpio libssl-dev libelf-dev ccache binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: load ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: odin-ccache-main

      - name: build kernel
        run: |
          BASE="https://github.com/$REPO/releases/download/$BASE_TAG"
          bash local/builder_odin.sh --fetch-pack "$BASE/odin-base-src.tar.zst" --clang-pack "$BASE/odin-clang.tar.zst" --ccache "$HOME/.ccache" --jobs $(nproc) --out "$PWD/out-artifacts"

      - name: pack boot.img
        run: |
          BASE="https://github.com/$REPO/releases/download/$BASE_TAG"
          curl -L --retry 3 -o cur_boot.img "$BASE/cur_boot.img"
          python3 tools/pack_boot.py out-artifacts/Image cur_boot.img out-artifacts/boot.img
          ls -la out-artifacts/

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-build
          path: |
            out-artifacts/Image
            out-artifacts/boot.img
