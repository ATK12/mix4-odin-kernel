name: MIX4 odin kernel build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'odin_patch/**', 'config/**', '.github/workflows/**', 'ak3/**' ]

env:
  TZ: Asia/Shanghai
  REPO: ATK12/mix4-odin-kernel
  BASE_TAG: v50-full-ATK12
  CCACHE_TAG: ccache
  CCACHE_MAXSIZE: 1G

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd pahole bc bison flex cpio libssl-dev libelf-dev ccache binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: load repo cache
        id: cache-load
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: odin-ccache-main

      - name: fetch shared ccache on miss
        if: ${{ steps.cache-load.outputs.cache-hit != 'true' }}
        run: |
          echo "repo cache miss, trying shared ccache ..."
          mkdir -p ~/.ccache
          # 1) ATK12 public shared cache (usable by every fork)
          curl -sL --retry 3 -o shared.tar.zst "https://github.com/ATK12/mix4-odin-kernel/releases/download/$CCACHE_TAG/odin-ccache.tar.zst" || true
          if [ -s shared.tar.zst ]; then tar -I zstd -xf shared.tar.zst -C ~/.ccache && echo "shared ccache loaded (ATK12)"; fi
          # 2) own repo cache (forks keep their own uploads)
          if [ ! -s shared.tar.zst ]; then
            curl -sL --retry 3 -o own.tar.zst "https://github.com/${{ github.repository }}/releases/download/$CCACHE_TAG/odin-ccache.tar.zst" || true
            if [ -s own.tar.zst ]; then tar -I zstd -xf own.tar.zst -C ~/.ccache && echo "own ccache loaded"; fi
          fi
          ccache -s 2>/dev/null || true

      - name: build kernel
        run: |
          BASE="https://github.com/$REPO/releases/download/$BASE_TAG"
          bash local/builder_odin.sh --fetch-pack "$BASE/odin-base-src.tar.zst" --clang-pack "$BASE/odin-clang.tar.zst" --ccache "$HOME/.ccache" --jobs $(nproc) --out "$PWD/out-artifacts"

      - name: pack boot.img
        run: |
          BASE="https://github.com/$REPO/releases/download/$BASE_TAG"
          curl -L --retry 3 -o cur_boot.img "$BASE/cur_boot.img"
          python3 tools/pack_boot.py out-artifacts/Image cur_boot.img out-artifacts/boot.img
          ls -la out-artifacts/

      - name: assemble full AK3 zip
        run: |
          BASE="https://github.com/$REPO/releases/download/$BASE_TAG"
          curl -L --retry 3 -o dtbo.img "$BASE/dtbo.img"
          curl -L --retry 3 -o vendor_boot.img "$BASE/vendor_boot.img"
          curl -L --retry 3 -o gpu0805-files.tar.zst "$BASE/gpu0805-files.tar.zst"
          mkdir -p gpu_files
          tar -I zstd -xf gpu0805-files.tar.zst -C gpu_files
          python3 tools/pack_ak3.py out-artifacts/Image dtbo.img vendor_boot.img gpu_files/files ak3 out-artifacts/odin-full.zip
          ls -la out-artifacts/

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-build
          path: |
            out-artifacts/Image
            out-artifacts/boot.img
            out-artifacts/odin-full.zip

      - name: publish build release (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date +%y%m%d%H%M%S)"
          gh release create "$TAG" out-artifacts/Image out-artifacts/boot.img out-artifacts/odin-full.zip \
            --repo "$REPO" --title "MIX4 odin kernel build $TAG" \
            --notes "Auto build artifacts: Image / boot.img / odin-full.zip (complete AK3). Author: ATK12"

      - name: upload shared ccache (auto)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo ">>> packing ccache ..."
          ccache -c 2>/dev/null || true
          tar -I "zstd -T0 -15" -cf odin-ccache.tar.zst -C ~/.ccache .
          echo "ccache pack: $(du -h odin-ccache.tar.zst | cut -f1)"
          echo ">>> upload to ${{ github.repository }} ..."
          gh release view "$CCACHE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create "$CCACHE_TAG" --repo "${{ github.repository }}" --title "shared ccache" --notes "auto uploaded after builds" >/dev/null 2>&1 || true
          gh release upload "$CCACHE_TAG" odin-ccache.tar.zst --repo "${{ github.repository }}" --clobber 2>&1 || echo "ccache upload skipped"
          echo ">>> ccache upload done"
